<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1b3e" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SEO:START — replaced per route at build time by prerender.js. The tags
         below are the dev-server defaults; do not hand-edit the built output. -->
    <title>Vittam – GST Billing Software for Indian Small Business</title>
    <meta
  name="description"
  content="Offline-first GST billing software for Indian kirana stores, cafes and restaurants. Fast billing, inventory, thermal printing and WhatsApp bills. Free for 1 month."
/>
    <link rel="canonical" href="https://vittam.vengurlatech.com/" />
    <!-- SEO:END -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- The font stylesheet used to be render-blocking, holding first paint for a
         round trip to Google. Preload it, then apply it asynchronously via the
         media="print" swap, with a <noscript> copy so it still lands without JS.
         `display=swap` in the URL means text paints in the fallback face first. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-slate-50">
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
