name: Vittam
description: "Billing app for small Indian businesses."
publish_to: 'none'
version: 1.1.9+21
  
environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  intl: ^0.20.2
  google_fonts: ^6.1.0
  flutter_thermal_printer: 2.0.0
  print_bluetooth_thermal: ^1.0.0
  permission_handler: ^11.0.0
  esc_pos_utils_plus: ^2.0.4
  barcode_widget: ^2.0.3
  barcode: ^2.2.0
  image: ^4.2.0
  image_picker: ^1.1.2
  share_plus: ^10.0.0

  # Firebase – update system
  firebase_core: ^3.3.0
  firebase_remote_config: ^5.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo.png
    - assets/sounds/new_order.mp3

  fonts:
    - family: Mangal
      fonts:
        - asset: assets/fonts/Mangal.ttf
        - asset: assets/fonts/Mangal-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
