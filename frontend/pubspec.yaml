name: Vittam
description: "Billing app for small Indian businesses."
publish_to: 'none'
version: 1.1.10+22
  
environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.0
  # Pinned to 2.3.7+1 (which depends on sqlite3 ^2.9.4). Newer sqflite_common_ffi
  # pulls sqlite3 >=3.1.2, whose native-assets build hook DOWNLOADS a prebuilt
  # libsqlite3 from GitHub at build time — that fails in CI behind a TLS-
  # intercepting proxy (CERTIFICATE_VERIFY_FAILED). sqlite3 2.9.4 has no such
  # hook (it bundles the library the old way), so the release build needs no
  # network fetch. Keep the sqlite3 override below in sync with this.
  sqflite_common_ffi: 2.3.7+1
  path_provider: ^2.1.0
  path: ^1.9.0
  intl: ^0.20.2
  google_fonts: ^6.1.0
  flutter_thermal_printer: 2.0.0
  print_bluetooth_thermal: ^1.0.0
  permission_handler: ^11.0.0
  esc_pos_utils_plus: ^2.0.4
  barcode_widget: ^2.0.3
  barcode: ^2.2.0
  image: ^4.2.0
  image_picker: ^1.1.2
  share_plus: ^10.0.0

  # Firebase – update system
  firebase_core: ^3.3.0
  firebase_remote_config: ^5.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.3
  audioplayers: ^6.1.0
  shimmer: ^3.0.0
  # A5/A4 PDF invoice generation + OS print dialog (share/save/print).
  # Requires Flutter >= 3.35 (Dart 3.9): pdf 3.12.0 needs archive 4.x (to match
  # flutter_thermal_printer) and vector_math ^2.2.0 (older flutter_test pinned
  # 2.1.4). CI's Flutter version is bumped accordingly in .github/workflows.
  pdf: ^3.12.0
  printing: ^5.13.3
  connectivity_plus: ^7.3.1
  # Purchase-list PDF import (Add Purchase form): text extraction from the
  # PDF generated by purchase_list_pdf.dart.
  syncfusion_flutter_pdf: ^33.2.13
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Force the pre-download-hook sqlite3 (2.9.4). See the note on
# sqflite_common_ffi above: sqlite3 >=3.1.2 downloads a prebuilt library from
# GitHub at build time, which breaks CI release builds behind a proxy that does
# TLS interception. 2.9.4 bundles the library without any network fetch.
dependency_overrides:
  sqlite3: 2.9.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo.png
    - assets/sounds/new_order.mp3

  fonts:
    - family: Mangal
      fonts:
        - asset: assets/fonts/Mangal.ttf
        - asset: assets/fonts/Mangal-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
