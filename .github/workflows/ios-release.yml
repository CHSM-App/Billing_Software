name: iOS Release

# Manual-trigger build/sign/upload of the iOS app to TestFlight / App Store
# Connect. No fastlane — signing material is a manually-created Apple
# Distribution certificate + App Store provisioning profile, stored as
# base64 repo secrets (see IOS_P12_BASE64 / IOS_PROVISION_PROFILE_BASE64).
on:
  workflow_dispatch:

env:
  # Keep in sync with FLUTTER_VERSION in ci.yml / windows-release.yml.
  FLUTTER_VERSION: '3.38.5'
  KEYCHAIN_NAME: ios-release.keychain
  KEYCHAIN_PASSWORD: temporary-ci-keychain-password

jobs:
  build:
    name: Build, sign, and upload to App Store Connect
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      # Decode the base64 secrets back into the actual .p12 / .mobileprovision
      # files, import the certificate into a fresh CI-only keychain, and
      # install the provisioning profile where Xcode's build tools look for it.
      - name: Import signing certificate and provisioning profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/Vittam_App_Store_Profile.mobileprovision"

          echo -n "$IOS_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          security import "$CERT_PATH" -k "$KEYCHAIN_NAME" -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed IPA
        working-directory: frontend
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # Authenticates with the App Store Connect API key (no Apple ID/password
      # needed) and uploads straight to TestFlight processing.
      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          IPA_PATH=$(find frontend/build/ios/ipa -name "*.ipa" | head -n1)

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_NAME" || true
