name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BACKEND_DIR: backend
  BACKEND_BRANCH: backend

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Backend tests (Jest + Supertest)
  # Runs on every push; no real DB needed — all DB calls are mocked.
  # ─────────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-access-secret-32-chars-long!!!
          JWT_REFRESH_SECRET: ci-refresh-secret-32-chars-long!!
          DB_HOST: localhost
          DB_PORT: '1433'
          DB_USER: ci
          DB_PASSWORD: ci
          DB_NAME: ci
          CORS_ORIGINS: http://localhost:3000

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  # ─────────────────────────────────────────────
  # Job 2: Flutter tests
  # Runs on every push; no device needed.
  # ─────────────────────────────────────────────
  test-flutter:
    name: Flutter tests
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Flutter tests with coverage
        working-directory: frontend
        run: flutter test --coverage

      - name: Upload Flutter coverage report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: frontend/coverage/
          retention-days: 14

  # ─────────────────────────────────────────────
  # Job 3: Sync backend folder → branch "backend"
  # Runs on every push to any branch (not tags)
  # ─────────────────────────────────────────────
  sync-backend:
    name: Sync backend → backend branch
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push backend folder to backend branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ env.BACKEND_BRANCH }}
          publish_dir: ./${{ env.BACKEND_DIR }}
          force_orphan: true
          exclude_assets: 'node_modules'
          commit_message: "sync: backend from ${{ github.ref_name }} @ ${{ github.sha }}"

  # ─────────────────────────────────────────────
  # Job 2: Build Flutter APK on tag push (v*)
  # ─────────────────────────────────────────────
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build APK (release)
        working-directory: frontend
        run: flutter build apk --release

      - name: Rename APK with tag version
        run: |
          mv frontend/build/app/outputs/flutter-apk/app-release.apk \
             frontend/build/app/outputs/flutter-apk/billing-${{ github.ref_name }}.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-apk-${{ github.ref_name }}
          path: frontend/build/app/outputs/flutter-apk/billing-*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/app/outputs/flutter-apk/billing-*.apk
          generate_release_notes: true
