name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  # Manual "Run workflow" button for Play Store deploys. Nothing is ever pushed
  # to the Play Store automatically — you trigger this deliberately and pick the
  # track / priority / rollout each time.
  workflow_dispatch:
    inputs:
      track:
        description: 'Target: sharing (Internal App Sharing link) or production'
        type: choice
        default: sharing
        options:
          - sharing
          - production
      priority:
        description: 'In-app update priority (0-5). 5 = forced full-screen update. Production only.'
        type: string
        default: '3'
      fraction:
        description: 'Staged rollout fraction for production (e.g. 0.1 = 10%). Ignored for sharing.'
        type: string
        default: '0.1'
      dry_run:
        description: 'Dry run — validate + authenticate but do NOT upload.'
        type: boolean
        default: true

permissions:
  contents: write

env:
  BACKEND_DIR: backend
  BACKEND_BRANCH: backend
  # 3.38.5 (Dart 3.9) — needed so `pdf`/`printing` resolve: pdf 3.12.0 requires
  # vector_math ^2.2.0, which older Flutter's flutter_test pinned to 2.1.4.
  # Matches the local dev SDK the app is built/tested against.
  FLUTTER_VERSION: '3.38.5'

jobs:
  # Job 1: Backend tests (Jest + Supertest)
  # Runs on every push; DB calls are mocked.
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-access-secret-32-chars-long!!!
          JWT_REFRESH_SECRET: ci-refresh-secret-32-chars-long!!
          DB_HOST: localhost
          DB_PORT: '1433'
          DB_USER: ci
          DB_PASSWORD: ci
          DB_NAME: ci
          CORS_ORIGINS: http://localhost:3000

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  # Job 2: Flutter tests
  # Runs on every push; no device needed.
  test-flutter:
    name: Flutter tests
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Flutter tests with coverage
        working-directory: frontend
        run: flutter test --coverage

      - name: Upload Flutter coverage report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: frontend/coverage/
          retention-days: 14

  # Job 3: Build landing page, copy output into backend/public/, then sync
  # the whole backend folder (including the fresh build) to the backend branch.
  sync-backend:
    name: Build landing page + sync backend branch
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: landingPage/package-lock.json

      - name: Install landing page dependencies
        working-directory: landingPage
        run: npm ci

      - name: Build landing page (outputs to backend/public/)
        working-directory: landingPage
        run: npm run build
        env:
          # API calls from the landing page go to the same domain — no prefix needed
          VITE_API_URL: ''

      - name: Install backend production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Remove backend/public/ exclusion so it gets deployed
        run: sed -i '/^backend\/public\//d' .gitignore

      - name: Push backend folder to backend branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ env.BACKEND_BRANCH }}
          publish_dir: ./${{ env.BACKEND_DIR }}
          force_orphan: true
          commit_message: "sync: backend + landing page from ${{ github.ref_name }} @ ${{ github.sha }}"

  # Job 4: Build Flutter APK + AAB on tag push (v*)
  build-apk:
    name: Build Flutter APK + AAB
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # tr -d whitespace strips any stray spaces/newlines the secret box may
        # have added, which would otherwise corrupt the decoded .jks.
        run: printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > frontend/android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STOREPASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYALIAS }}
        # Reference the env vars (not ${{ }} inline) so no shell expansion mangles
        # special characters like '@' in the password.
        run: |
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
            printf 'storeFile=app/upload-keystore.jks\n'
          } > frontend/android/key.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > frontend/android/app/google-services.json

      - name: Build APK (release)
        working-directory: frontend
        run: flutter build apk --release

      - name: Build AAB (release)
        working-directory: frontend
        run: flutter build appbundle --release

      - name: Rename APK and AAB with tag version
        run: |
          mv frontend/build/app/outputs/flutter-apk/app-release.apk \
            frontend/build/app/outputs/flutter-apk/billing-${{ github.ref_name }}.apk
          mv frontend/build/app/outputs/bundle/release/app-release.aab \
            frontend/build/app/outputs/bundle/release/billing-${{ github.ref_name }}.aab

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-apk-${{ github.ref_name }}
          path: frontend/build/app/outputs/flutter-apk/billing-*.apk
          retention-days: 30

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-aab-${{ github.ref_name }}
          path: frontend/build/app/outputs/bundle/release/billing-*.aab
          retention-days: 30

      - name: Create GitHub Release with APK and AAB
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/build/app/outputs/flutter-apk/billing-*.apk
            frontend/build/app/outputs/bundle/release/billing-*.aab
          generate_release_notes: true

  # Job 5: Build Flutter Windows release on tag push (v*)
  build-windows:
    name: Build Flutter Windows
    runs-on: windows-2022
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # cache: false on purpose. A cached build tree from an older runner image
      # carries a CMakeCache.txt that pins "Visual Studio 16 2019", which no
      # longer exists on windows-latest (VS 2022 only). Restoring it makes the
      # CMake project() call fail before any of our steps run.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      # Extra safety: wipe any local CMake cache so CMake re-detects Visual Studio.
      # Runs before pub get since flutter clean also removes .dart_tool.
      - name: Clean previous build cache
        working-directory: frontend
        run: flutter clean

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      # Pin the generator to the Visual Studio that actually ships on
      # windows-latest (VS 2022 = "Visual Studio 17 2022"). This forces CMake
      # off the stale "Visual Studio 16 2019" default even if a cache slips in.
      - name: Build Windows release
        working-directory: frontend
        env:
          CMAKE_GENERATOR: 'Visual Studio 17 2022'
        run: flutter build windows --release

      - name: Copy output with tag version
        shell: bash
        run: |
          mkdir -p frontend/build/windows/dist
          cp -r "frontend/build/windows/x64/runner/Release/." \
            "frontend/build/windows/dist/billing-${{ github.ref_name }}-windows"

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "frontend/build/windows/dist/billing-${{ github.ref_name }}-windows" `
            -DestinationPath "frontend/build/windows/dist/billing-${{ github.ref_name }}-windows.zip"

      - name: Upload Windows build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-windows-${{ github.ref_name }}
          path: frontend/build/windows/dist/billing-*.zip
          retention-days: 30

      - name: Add Windows build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/windows/dist/billing-*.zip

  # Job 6: Build unsigned Flutter iOS IPA on tag push (v*)
  # This creates an unsigned IPA artifact. App Store/TestFlight distribution
  # still requires Apple code signing and provisioning.
  build-ios:
    name: Build Flutter iOS
    runs-on: macos-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build iOS app without code signing
        working-directory: frontend
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p frontend/build/ios/ipa/Payload
          cp -R frontend/build/ios/iphoneos/Runner.app frontend/build/ios/ipa/Payload/Runner.app
          cd frontend/build/ios/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload billing-${{ github.ref_name }}.ipa

      - name: Upload iOS build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-ios-${{ github.ref_name }}
          path: frontend/build/ios/ipa/billing-*.ipa
          retention-days: 30

      - name: Add iOS build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/ios/ipa/billing-*.ipa

  # Job 7: Deploy signed AAB to the Play Store.
  # Manual only — triggered from the Actions tab via "Run workflow". Builds a
  # fresh signed AAB (same signing steps as build-apk) and hands it to
  # deploy/deploy.js, which uploads it to the chosen track.
  deploy-playstore:
    name: Deploy to Play Store
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # tr -d whitespace strips any stray spaces/newlines the secret box may
        # have added, which would otherwise corrupt the decoded .jks.
        run: printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > frontend/android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STOREPASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYALIAS }}
        # Reference the env vars (not ${{ }} inline) so no shell expansion mangles
        # special characters like '@' in the password.
        run: |
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
            printf 'storeFile=app/upload-keystore.jks\n'
          } > frontend/android/key.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > frontend/android/app/google-services.json

      - name: Build AAB (release)
        working-directory: frontend
        run: flutter build appbundle --release

      - name: Write Play service account
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_SA" > deploy/service-account.json

      - name: Install deploy dependencies
        working-directory: deploy
        run: npm ci

      - name: Deploy to Play Store
        working-directory: deploy
        run: >
          node deploy.js --yes
          --track=${{ github.event.inputs.track }}
          --priority=${{ github.event.inputs.priority }}
          --fraction=${{ github.event.inputs.fraction }}
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Clean up secrets
        if: always()
        run: |
          rm -f deploy/service-account.json
          rm -f frontend/android/key.properties
          rm -f frontend/android/app/upload-keystore.jks
          rm -f frontend/android/app/google-services.json
