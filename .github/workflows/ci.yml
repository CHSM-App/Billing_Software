name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BACKEND_DIR: backend
  BACKEND_BRANCH: backend
  FLUTTER_VERSION: '3.32.0'

jobs:
  # Job 1: Backend tests (Jest + Supertest)
  # Runs on every push; DB calls are mocked.
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-access-secret-32-chars-long!!!
          JWT_REFRESH_SECRET: ci-refresh-secret-32-chars-long!!
          DB_HOST: localhost
          DB_PORT: '1433'
          DB_USER: ci
          DB_PASSWORD: ci
          DB_NAME: ci
          CORS_ORIGINS: http://localhost:3000

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  # Job 2: Flutter tests
  # Runs on every push; no device needed.
  test-flutter:
    name: Flutter tests
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Flutter tests with coverage
        working-directory: frontend
        run: flutter test --coverage

      - name: Upload Flutter coverage report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: frontend/coverage/
          retention-days: 14

  # Job 3: Build landing page, copy output into backend/public/, then sync
  # the whole backend folder (including the fresh build) to the backend branch.
  sync-backend:
    name: Build landing page + sync backend branch
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: landingPage/package-lock.json

      - name: Install landing page dependencies
        working-directory: landingPage
        run: npm ci

      - name: Build landing page (outputs to backend/public/)
        working-directory: landingPage
        run: npm run build
        env:
          # API calls from the landing page go to the same domain — no prefix needed
          VITE_API_URL: ''

      - name: Install backend production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Remove backend/public/ exclusion so it gets deployed
        run: sed -i '/^backend\/public\//d' .gitignore

      - name: Push backend folder to backend branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ env.BACKEND_BRANCH }}
          publish_dir: ./${{ env.BACKEND_DIR }}
          force_orphan: true
          commit_message: "sync: backend + landing page from ${{ github.ref_name }} @ ${{ github.sha }}"

  # Job 4: Build Flutter APK + AAB on tag push (v*)
  build-apk:
    name: Build Flutter APK + AAB
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > frontend/android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          EOF

      - name: Build APK (release)
        working-directory: frontend
        run: flutter build apk --release

      - name: Build AAB (release)
        working-directory: frontend
        run: flutter build appbundle --release

      - name: Rename APK and AAB with tag version
        run: |
          mv frontend/build/app/outputs/flutter-apk/app-release.apk \
            frontend/build/app/outputs/flutter-apk/billing-${{ github.ref_name }}.apk
          mv frontend/build/app/outputs/bundle/release/app-release.aab \
            frontend/build/app/outputs/bundle/release/billing-${{ github.ref_name }}.aab

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-apk-${{ github.ref_name }}
          path: frontend/build/app/outputs/flutter-apk/billing-*.apk
          retention-days: 30

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-aab-${{ github.ref_name }}
          path: frontend/build/app/outputs/bundle/release/billing-*.aab
          retention-days: 30

      - name: Create GitHub Release with APK and AAB
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/build/app/outputs/flutter-apk/billing-*.apk
            frontend/build/app/outputs/bundle/release/billing-*.aab
          generate_release_notes: true

  # Job 5: Build Flutter Windows release on tag push (v*)
  build-windows:
    name: Build Flutter Windows
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Windows release
        working-directory: frontend
        run: flutter build windows --release

      - name: Copy output with tag version
        shell: bash
        run: |
          mkdir -p frontend/build/windows/dist
          cp -r "frontend/build/windows/x64/runner/Release/." \
            "frontend/build/windows/dist/billing-${{ github.ref_name }}-windows"

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "frontend/build/windows/dist/billing-${{ github.ref_name }}-windows" `
            -DestinationPath "frontend/build/windows/dist/billing-${{ github.ref_name }}-windows.zip"

      - name: Upload Windows build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-windows-${{ github.ref_name }}
          path: frontend/build/windows/dist/billing-*.zip
          retention-days: 30

      - name: Add Windows build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/windows/dist/billing-*.zip

  # Job 6: Build unsigned Flutter iOS IPA on tag push (v*)
  # This creates an unsigned IPA artifact. App Store/TestFlight distribution
  # still requires Apple code signing and provisioning.
  build-ios:
    name: Build Flutter iOS
    runs-on: macos-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build iOS app without code signing
        working-directory: frontend
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p frontend/build/ios/ipa/Payload
          cp -R frontend/build/ios/iphoneos/Runner.app frontend/build/ios/ipa/Payload/Runner.app
          cd frontend/build/ios/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload billing-${{ github.ref_name }}.ipa

      - name: Upload iOS build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-ios-${{ github.ref_name }}
          path: frontend/build/ios/ipa/billing-*.ipa
          retention-days: 30

      - name: Add iOS build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/ios/ipa/billing-*.ipa
