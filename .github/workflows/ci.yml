name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Sync backend folder → branch "backend"
  # Runs on every push to any branch (not tags)
  # ─────────────────────────────────────────────
  sync-backend:
    name: Sync backend → backend branch
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend folder to backend branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if backend branch exists on remote
          if git ls-remote --exit-code --heads origin backend; then
            # Branch exists — fetch and check it out as a worktree
            git fetch origin backend
            git worktree add /tmp/backend-branch origin/backend
            cd /tmp/backend-branch
            git checkout -B backend origin/backend
          else
            # Branch does not exist — create orphan worktree manually
            mkdir -p /tmp/backend-branch
            cd /tmp/backend-branch
            git init
            git remote add origin "$(git -C $GITHUB_WORKSPACE remote get-url origin)"
            git checkout --orphan backend
          fi

          # Sync only the backend/ folder contents into the branch root
          rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            $GITHUB_WORKSPACE/backend/ /tmp/backend-branch/

          cd /tmp/backend-branch
          git add -A

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No backend changes to sync."
          else
            git commit -m "sync: backend from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
            git push origin backend
          fi

  # ─────────────────────────────────────────────
  # Job 2: Build Flutter APK on tag push (v*)
  # ─────────────────────────────────────────────
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build APK (release)
        working-directory: frontend
        run: flutter build apk --release

      - name: Rename APK with tag version
        run: |
          TAG=${GITHUB_REF_NAME}
          mv frontend/build/app/outputs/flutter-apk/app-release.apk \
             frontend/build/app/outputs/flutter-apk/billing-${TAG}.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-apk-${{ github.ref_name }}
          path: frontend/build/app/outputs/flutter-apk/billing-*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/app/outputs/flutter-apk/billing-*.apk
          generate_release_notes: true
